name: Dredge Echo Research Demo

on:
  workflow_dispatch:
    inputs:
      question:
        description: "Research question for the live Tavily -> Token Factory demo"
        required: false
        default: "What are the latest practical developments in agentic AI infrastructure?"
        type: string
  push:
    branches:
      - feat/dredge-echo-research-workflow
    paths:
      - ".github/workflows/dredge-echo-research.yml"
      - "bridge/**"
      - "scripts/smoke_research.py"
      - "tests/test_search_adapter.py"
      - "tests/test_research_agent.py"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: dredge-echo-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  grounded-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAVILY_PROJECT: ${{ vars.TAVILY_PROJECT || 'dredge-echo-agent' }}
      NEBIUS_MODEL: ${{ vars.NEBIUS_MODEL }}
      NEBIUS_BASE_URL: ${{ vars.NEBIUS_BASE_URL || 'https://api.tokenfactory.nebius.com/v1' }}
      RESEARCH_QUESTION: ${{ inputs.question || 'What are the latest practical developments in agentic AI infrastructure?' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate live research configuration
        shell: bash
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: |
          test -n "$TAVILY_API_KEY" || { echo "TAVILY_API_KEY secret is missing"; exit 1; }
          test -n "$TAVILY_PROJECT" || { echo "TAVILY_PROJECT variable is missing"; exit 1; }
          test -n "$NEBIUS_API_KEY" || { echo "NEBIUS_API_KEY secret is missing"; exit 1; }
          test -n "$NEBIUS_MODEL" || { echo "NEBIUS_MODEL variable is missing"; exit 1; }
          test -n "$NEBIUS_BASE_URL" || { echo "NEBIUS_BASE_URL variable is missing"; exit 1; }
          echo "Live research configuration is present."
          echo "Nebius model: $NEBIUS_MODEL"
          echo "Tavily project: $TAVILY_PROJECT"
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          parsed = urlparse(os.environ["NEBIUS_BASE_URL"])
          print(f"Nebius endpoint host: {parsed.netloc or '(invalid URL)'}")
          PY

      - name: Install Dredge Echo agent dependencies
        run: python -m pip install -e ".[agent]"

      - name: Run retrieval and orchestration unit tests
        run: python -m unittest tests.test_search_adapter tests.test_research_agent

      - name: Run live Tavily to Token Factory research cycle
        shell: bash
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: |
          echo "Research question: $RESEARCH_QUESTION"
          echo "Run started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python scripts/smoke_research.py "$RESEARCH_QUESTION"
          echo "Run finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
