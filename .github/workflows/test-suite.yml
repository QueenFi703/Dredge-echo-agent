name: Test Suite

on:
  push:
    branches: [ main, develop, 'feature/*', 'feat/*' ]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dredge Echo test dependencies
        run: python -m pip install -e ".[agent]"

      - name: Run Python test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
