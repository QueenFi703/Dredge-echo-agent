name: Nebius Kimi Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebius-kimi-smoke
  cancel-in-progress: false

jobs:
  call-kimi:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate Token Factory configuration
        shell: bash
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          ARBITRATION_MODEL: ${{ vars.ARBITRATION_MODEL || 'moonshotai/Kimi-K3' }}
        run: |
          test -n "$NEBIUS_API_KEY" || { echo "NEBIUS_API_KEY secret is missing"; exit 1; }
          test -n "$ARBITRATION_MODEL" || { echo "ARBITRATION_MODEL variable is missing"; exit 1; }

      - name: Install Nebius client
        run: python -m pip install -e ".[nebius]"

      - name: Call Kimi through Token Factory
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          ARBITRATION_MODEL: ${{ vars.ARBITRATION_MODEL || 'moonshotai/Kimi-K3' }}
          NEBIUS_BASE_URL: ${{ vars.NEBIUS_BASE_URL || 'https://api.tokenfactory.nebius.com/v1' }}
        run: python scripts/smoke_nebius.py
