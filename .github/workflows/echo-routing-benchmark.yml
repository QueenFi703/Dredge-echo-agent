name: Echo paired routing benchmark
on:
  push:
    branches: [codex/echo-final-verification-routing]
    paths:
      - "scripts/benchmark_routing.py"
      - ".github/workflows/echo-routing-benchmark.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEBIUS_MODEL: ${{ vars.ARCHITECT_MODEL || 'zai-org/GLM-5.3-Flash' }}
      ARBITRATION_MODEL: ${{ vars.ARBITRATION_MODEL || 'moonshotai/Kimi-K3' }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
      NEBIUS_BASE_URL: ${{ vars.NEBIUS_BASE_URL || 'https://api.tokenfactory.nebius.com/v1' }}
      TAVILY_PROJECT: ${{ vars.TAVILY_PROJECT || 'dredge-echo-agent' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[agent]"
      - run: python -m unittest discover -s tests -q
      - name: Measure paired routing with final verification
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python scripts/benchmark_routing.py routing-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: echo-routing-benchmark
          path: routing-benchmark.json
          if-no-files-found: warn
